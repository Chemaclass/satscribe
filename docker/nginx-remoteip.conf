##
# Real IP Addresses
#
# Replaces the image default, which reads CF-Connecting-IP. Satscribe does not
# sit behind Cloudflare, so that header arrives straight from the caller and
# whoever sends it picks their own REMOTE_ADDR. kamal-proxy overwrites
# X-Forwarded-For with the address it accepted the connection from, so that is
# the only header here that a client cannot choose.
##

# kamal-proxy reaches the container over the docker network, and nothing else
# can: the container publishes no ports.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

real_ip_header X-Forwarded-For;
real_ip_recursive on;
